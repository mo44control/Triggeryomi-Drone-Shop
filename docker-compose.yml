version: "3.9"

services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       triggeryomi
      POSTGRES_USER:     triggeryomi
      POSTGRES_PASSWORD: triggeryomipass
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U triggeryomi"]
      interval: 5s
      timeout:  5s
      retries:  10

  # ── API server (Express + Drizzle) ───────────────────────────────────────
  api:
    build:
      context:    .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      PORT:         "8080"
      DATABASE_URL: "postgresql://triggeryomi:triggeryomipass@db:5432/triggeryomi"
      SESSION_SECRET: "${SESSION_SECRET:-change-me-to-a-long-random-secret-string}"
      NODE_ENV:     production
    depends_on:
      db:
        condition: service_healthy

  # ── Web frontend (Vite → nginx) ──────────────────────────────────────────
  web:
    build:
      context:    .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    ports:
      - "${PORT:-80}:80"    # browse to http://localhost
    depends_on:
      - api

volumes:
  pgdata:
