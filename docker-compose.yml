version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: triggeryomi
      POSTGRES_USER: triggeryomi
      POSTGRES_PASSWORD: triggeryomipass
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triggeryomi"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      PORT: 8080
      DATABASE_URL: postgresql://triggeryomi:triggeryomipass@db:5432/triggeryomi
      SESSION_SECRET: ${SESSION_SECRET:-change-me-to-a-long-random-secret}
      NODE_ENV: production
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    environment:
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
